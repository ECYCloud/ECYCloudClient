name: 出包与发布

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        required: true
      channel:
        type: choice
        options: [last, pre]
        default: last

permissions:
  contents: read

env:
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
  INNO_SETUP_SHA256: 9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732
  FLUTTER_REPO: https://github.com/flutter/flutter.git
  FLUTTER_TAG: "3.44.8"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
      has_android: ${{ steps.resolve.outputs.has_android }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_TYPE: ${{ github.ref_type }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          publish=false
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            channel="$INPUT_CHANNEL"
            publish=true
          elif [ "$REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            channel=last
            case "$version" in
              *-pre) version="${version%-pre}"; channel=pre ;;
            esac
            publish=true
          else
            version="$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' app/pubspec.yaml | head -n1)"
            channel=last
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "版本号必须是 X.Y.Z，实际是「$version」" >&2
            exit 1
          fi
          if [ "$channel" = pre ]; then
            tag="v$version-pre"
          else
            tag="v$version"
          fi
          if [ -n "$ANDROID_KEYSTORE" ]; then
            has_android=true
          else
            has_android=false
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "has_android=$has_android"
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: native/windows/service/go.mod
          cache-dependency-path: native/windows/service/go.sum

      - name: 安装 Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_TAG $env:FLUTTER_REPO "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $setup -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($actual -ne $env:INNO_SETUP_SHA256) {
            throw "Inno Setup 校验失败：期望 $env:INNO_SETUP_SHA256，实际 $actual"
          }
          Start-Process -FilePath $setup -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          "${env:ProgramFiles(x86)}\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 出包
        shell: pwsh
        run: |
          flutter --version
          ./scripts/build-windows.ps1 -Arch ${{ matrix.arch }} -Version ${{ needs.prepare.outputs.version }} -Channel ${{ needs.prepare.outputs.channel }} -Installer -SkipAssetSync

      - uses: actions/upload-artifact@v6
        with:
          name: installer-windows-${{ matrix.arch }}
          path: build/installer/ECYCloud-*.exe
          if-no-files-found: error

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # actool 编 AppIcon.icon：macos-15 上会崩（AssetCatalogAgent 断连）；
    # Xcode 26.5 在 Tahoe 上也会崩（nil object）。钉 macos-26 + 26.6。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: 选用 Xcode 26.6
        run: |
          if [[ ! -d /Applications/Xcode_26.6.app ]]; then
            echo "runner 上没有 Xcode 26.6，编不出 Liquid Glass 图标" >&2
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - uses: actions/setup-go@v6
        with:
          go-version-file: native/unix/helper/go.mod
          cache-dependency-path: native/unix/helper/go.sum

      - name: 安装 Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_TAG" "$FLUTTER_REPO" "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: 出包
        run: |
          flutter --version
          chmod +x scripts/*.sh
          ./scripts/build-macos.sh --arch ${{ matrix.arch }} \
            --version ${{ needs.prepare.outputs.version }} \
            --channel ${{ needs.prepare.outputs.channel }} --package

      - uses: actions/upload-artifact@v6
        with:
          name: installer-macos-${{ matrix.arch }}
          path: build/installer/ECYCloud-*-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    steps:
      - name: 安装构建依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates clang cmake curl file git jq ninja-build \
            pkg-config rpm unzip xz-utils zip libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev \
            libmpv-dev
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: native/unix/helper/go.mod
          cache-dependency-path: native/unix/helper/go.sum

      - name: 安装 Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_TAG" "$FLUTTER_REPO" "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: 出包
        run: |
          flutter --version
          chmod +x scripts/*.sh
          ./scripts/build-linux.sh --arch ${{ matrix.arch }} --version ${{ needs.prepare.outputs.version }} \
            --channel ${{ needs.prepare.outputs.channel }} --package

      - uses: actions/upload-artifact@v6
        with:
          name: installer-linux-${{ matrix.arch }}-deb
          path: build/installer/ECYCloud-*-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: installer-linux-${{ matrix.arch }}-rpm
          path: build/installer/ECYCloud-*-linux-${{ matrix.arch }}.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: installer-linux-${{ matrix.arch }}-tar
          path: build/installer/ECYCloud-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  android:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true' || needs.prepare.outputs.has_android == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: native/android/mihomo/go.mod
          cache-dependency-path: native/android/mihomo/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_TAG" "$FLUTTER_REPO" "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: 准备签名密钥
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo '缺少 ANDROID_KEYSTORE，无法产出可覆盖安装的正式包' >&2
            exit 1
          fi
          umask 077
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: 出包
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?运行器未提供 Android NDK}"
          flutter --version
          chmod +x scripts/*.sh
          ./scripts/build-android.sh --version ${{ needs.prepare.outputs.version }} \
            --channel ${{ needs.prepare.outputs.channel }} --build-number ${{ github.run_number }}

      - name: 清理签名密钥
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v6
        with:
          name: installer-android-arm64
          path: build/installer/ECYCloud-*-android-arm64.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: installer-android-arm
          path: build/installer/ECYCloud-*-android-arm.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: installer-android-x64
          path: build/installer/ECYCloud-*-android-x64.apk
          if-no-files-found: error

  openwrt:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 安装 SDK 依赖
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential file gawk git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip wget zstd

      - uses: actions/cache@v4
        with:
          path: build/cache/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          key: openwrt-sdk-25.12.5-x86-64-0c8df0151a1e88fe

      - name: 出包
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-openwrt.sh --version ${{ needs.prepare.outputs.version }}

      - uses: actions/upload-artifact@v6
        with:
          name: installer-openwrt-25.12
          path: build/installer/ECYCloud-*-openwrt-25.12.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, windows, macos, linux, android, openwrt]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: installer
          pattern: installer-*
          merge-multiple: true

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          kernel="$(jq -r '.mihomo.version' scripts/kernel.lock.json)"
          if [ "$CHANNEL" = pre ]; then
            title="Pre $VERSION"
            is_pre=true
          else
            title="v$VERSION"
            is_pre=false
          fi
          {
            echo "ECY Cloud 客户端 $title，随包 mihomo $kernel。"
            if [ "$is_pre" = true ]; then
              echo
              echo "> **Pre 测试版**：用于验证新功能，可能仍有未修复的问题；日常使用请优先等待正式版（非 Pre-release）。"
            fi
            echo
            echo "## 该下载哪个？"
            echo
            echo "多数用户按设备选下面这一行即可，不要下错架构："
            echo
            echo "| 你的设备 | 下载这个 |"
            echo "| --- | --- |"
            echo "| Windows 电脑（常见 64 位） | \`ECYCloud-$VERSION-windows-x64.exe\` |"
            echo "| Windows on ARM（部分 Surface / ARM 笔记本） | \`ECYCloud-$VERSION-windows-arm64.exe\` |"
            echo "| Mac（Apple 芯片：M1 / M2 / M3 / M4） | \`ECYCloud-$VERSION-macos-arm64.pkg\` |"
            echo "| Mac（Intel） | \`ECYCloud-$VERSION-macos-x64.pkg\` |"
            echo "| Android 手机 / 平板（主流） | \`ECYCloud-$VERSION-android-arm64.apk\` |"
            echo "| Debian / Ubuntu 及衍生版 | \`ECYCloud-$VERSION-linux-x64.deb\` 或 \`...-linux-arm64.deb\` |"
            echo "| Fedora / openSUSE / RHEL 系 | \`ECYCloud-$VERSION-linux-x64.rpm\` 或 \`...-linux-arm64.rpm\` |"
            echo "| 其它 Linux（Arch 等） | \`ECYCloud-$VERSION-linux-*.tar.gz\`，解包后 \`sudo ./install.sh\` |"
            echo "| OpenWrt 25.12（apk） | \`ECYCloud-$VERSION-openwrt-25.12.tar.gz\` |"
            echo
            echo "不确定 Windows / Mac 架构时：Windows 看「设置 → 系统 → 关于 → 系统类型」；Mac 看「关于本机」，芯片写 Apple 则选 arm64，写 Intel 则选 x64。Android 真机几乎都是 arm64；\`android-arm.apk\` 仅旧 32 位设备，\`android-x64.apk\` 仅模拟器。"
            echo
            echo "OpenWrt 包是 noarch apk，解包后先挂第三方源装 \`mihomo\`（如 \`mihomo-meta\`，**不要装 nikki**），再 \`apk add --allow-untrusted ./luci-app-ecycloud-*.apk ./luci-i18n-ecycloud-*.apk\`。此包只对 25.12；24.10 / 23.05 仍是 ipk，需自己用对应 SDK 编。"
            echo
            echo "桌面三端安装时需要一次管理员授权以注册后台服务，此后日常使用不再要求提权；Android 首次连接时会弹出系统的 VPN 授权。客户端每 24 小时检查一次自身与 mihomo 内核更新，发现新版会在界面上提示。"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installer/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease="$is_pre"
          else
            gh release create "$TAG" installer/* --title "$title" --notes-file notes.md --prerelease="$is_pre"
          fi
