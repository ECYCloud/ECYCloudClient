name: 出包与发布

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        required: true
      channel:
        type: choice
        options: [last, pre]
        default: last

permissions:
  contents: read

env:
  INNO_SETUP_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
  INNO_SETUP_SHA256: 8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0
  CODE_SIGN_TOOL_URL: https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.0/CodeSignTool-v1.3.0-windows.zip
  CODE_SIGN_TOOL_SHA256: E22094505DECBE622AFE5B0C27ABC618ED2BA179BD94F3450490352399D5EF2A
  FLUTTER_REPO: https://github.com/flutter/flutter.git
  FLUTTER_TAG: "3.47.5"
  FLUTTER_COMMIT: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          publish=false
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            channel="$INPUT_CHANNEL"
            publish=true
          elif [ "$REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            channel=last
            case "$version" in
              *-pre) version="${version%-pre}"; channel=pre ;;
            esac
            publish=true
          else
            version="$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' app/pubspec.yaml | head -n1)"
            channel=last
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "版本号必须是 X.Y.Z，实际是「$version」" >&2
            exit 1
          fi
          if [ "$channel" = pre ]; then
            tag="v$version-pre"
          else
            tag="v$version"
          fi
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    # 矩阵各腿写同名输出会互相覆盖，必须按架构分名
    outputs:
      stage_sha256_x64: ${{ steps.stage.outputs.sha256_x64 }}
      stage_sha256_arm64: ${{ steps.stage.outputs.sha256_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/windows/service/go.mod
          cache-dependency-path: native/windows/service/go.sum

      - name: 安装 Flutter
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:FLUTTER_TAG $env:FLUTTER_REPO "$env:RUNNER_TEMP\flutter"
          if ((git -C "$env:RUNNER_TEMP\flutter" rev-parse HEAD).Trim() -ne $env:FLUTTER_COMMIT) { throw 'Flutter 来源提交校验失败' }
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 安装 Inno Setup
        if: needs.prepare.outputs.publish != 'true'
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $setup -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($actual -ne $env:INNO_SETUP_SHA256) {
            throw "Inno Setup 校验失败：期望 $env:INNO_SETUP_SHA256，实际 $actual"
          }
          $innoDir = "$env:RUNNER_TEMP\InnoSetup7"
          $process = Start-Process -FilePath $setup -WindowStyle Hidden -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/PORTABLE=1', '/CURRENTUSER', "/DIR=`"$innoDir`""
          if ($process.ExitCode -ne 0) { throw "Inno Setup 安装失败：退出码 $($process.ExitCode)" }
          $innoDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Flutter 分析与回归
        if: matrix.arch == 'x64'
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw '依赖锁定校验失败' }
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Flutter 静态分析失败' }
          flutter test --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Flutter 回归测试失败' }

      - name: Windows 服务回归
        working-directory: native/windows/service
        shell: pwsh
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows 服务回归测试失败' }

      - name: 出包
        shell: pwsh
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          flutter --version
          ./scripts/build-windows.ps1 -Arch ${{ matrix.arch }} -Version ${{ needs.prepare.outputs.version }} -Channel ${{ needs.prepare.outputs.channel }} -Installer:($env:PUBLISH -ne 'true') -SkipAssetSync

      - name: 打包组装产物
        id: stage
        if: needs.prepare.outputs.publish == 'true'
        shell: pwsh
        run: |
          tar -C build/windows/${{ matrix.arch }} -cf build/windows-stage-${{ matrix.arch }}.tar .
          if ($LASTEXITCODE -ne 0) { throw '组装产物打包失败' }
          $hash = (Get-FileHash -Algorithm SHA256 build/windows-stage-${{ matrix.arch }}.tar).Hash.ToLower()
          "sha256_${{ matrix.arch }}=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: stage-windows-${{ matrix.arch }}
          path: build/windows-stage-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish != 'true'
        with:
          name: installer-windows-${{ matrix.arch }}
          path: build/installer/ECYCloud-*.exe
          if-no-files-found: error

  # 签名凭据只存于 windows-signing 环境、只进入本作业；本作业不运行 Flutter / pub / Go 依赖的任何代码，
  # 只签 sha256 与 windows 作业输出一致的组装产物
  windows-sign:
    needs: [prepare, windows]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    environment: windows-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stage-windows-${{ matrix.arch }}
          path: build

      - name: 核对并解包组装产物
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.windows.outputs[format('stage_sha256_{0}', matrix.arch)] }}
        run: |
          $archive = 'build/windows-stage-${{ matrix.arch }}.tar'
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          if (-not $env:EXPECTED_SHA256 -or $actual -ne $env:EXPECTED_SHA256) {
            throw "组装产物校验失败：期望 $env:EXPECTED_SHA256，实际 $actual"
          }
          New-Item -ItemType Directory -Force -Path build/windows/${{ matrix.arch }} | Out-Null
          tar -C build/windows/${{ matrix.arch }} -xf $archive
          if ($LASTEXITCODE -ne 0) { throw '组装产物解包失败' }

      - name: 检查代码签名凭据
        id: esigner
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: |
          $names = @('ES_USERNAME', 'ES_PASSWORD', 'ES_CREDENTIAL_ID', 'ES_TOTP_SECRET')
          $missing = @($names | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -eq $names.Count) {
            Write-Host '未配置 eSigner Secrets，出未签名包'
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          if ($missing.Count -gt 0) { throw "eSigner Secrets 不完整，缺少：$($missing -join ', ')" }
          'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        if: steps.esigner.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: "21"

      # 只用来落地 CodeSignTool 与正式环境配置并导出 CODE_SIGN_TOOL_PATH；实际签名由 sign-windows.ps1 完成，
      # 因为 Inno 的卸载程序只能在 ISCC 编译期间经 SignTool 签名
      - name: 安装 CodeSignTool
        if: steps.esigner.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $archive = "$env:RUNNER_TEMP\codesigntool.zip"
          Invoke-WebRequest -Uri $env:CODE_SIGN_TOOL_URL -OutFile $archive -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($actual -ne $env:CODE_SIGN_TOOL_SHA256) {
            throw "CodeSignTool 校验失败：期望 $env:CODE_SIGN_TOOL_SHA256，实际 $actual"
          }
          $dir = "$env:RUNNER_TEMP\codesigntool"
          Expand-Archive -Path $archive -DestinationPath $dir
          # 包内自带的配置缺签名命令会读取的 TSA_LEGACY_URL，整份覆盖为正式环境配置
          Set-Content -Path "$dir\conf\code_sign_tool.properties" -Encoding ascii -Value @(
            'CLIENT_ID=kaXTRACNijSWsFdRKg_KAfD3fqrBlzMbWs6TwWHwAn8'
            'OAUTH2_ENDPOINT=https://login.ssl.com/oauth2/token'
            'CSC_API_ENDPOINT=https://cs.ssl.com'
            'TSA_URL=http://ts.ssl.com'
            'TSA_LEGACY_URL=http://ts.ssl.com/legacy'
          )
          "CODE_SIGN_TOOL_PATH=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 安装 Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_SETUP_URL -OutFile $setup -UseBasicParsing
          $actual = (Get-FileHash -Algorithm SHA256 $setup).Hash
          if ($actual -ne $env:INNO_SETUP_SHA256) {
            throw "Inno Setup 校验失败：期望 $env:INNO_SETUP_SHA256，实际 $actual"
          }
          $innoDir = "$env:RUNNER_TEMP\InnoSetup7"
          $process = Start-Process -FilePath $setup -WindowStyle Hidden -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/PORTABLE=1', '/CURRENTUSER', "/DIR=`"$innoDir`""
          if ($process.ExitCode -ne 0) { throw "Inno Setup 安装失败：退出码 $($process.ExitCode)" }
          $innoDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: 签名打包
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: ./scripts/build-windows.ps1 -Arch ${{ matrix.arch }} -Version ${{ needs.prepare.outputs.version }} -Channel ${{ needs.prepare.outputs.channel }} -Installer -FromStage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-windows-${{ matrix.arch }}
          path: build/installer/ECYCloud-*.exe
          if-no-files-found: error

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # actool 编 AppIcon.icon：macos-15 上会崩（AssetCatalogAgent 断连）；
    # Xcode 26.5 在 Tahoe 上也会崩（nil object）。钉 macos-26 + 26.6。
    runs-on: macos-26
    # 矩阵各腿写同名输出会互相覆盖，必须按架构分名
    outputs:
      stage_sha256_x64: ${{ steps.stage.outputs.sha256_x64 }}
      stage_sha256_arm64: ${{ steps.stage.outputs.sha256_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 选用 Xcode 26.6
        run: |
          if [[ ! -d /Applications/Xcode_26.6.app ]]; then
            echo "runner 上没有 Xcode 26.6，编不出 Liquid Glass 图标" >&2
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/unix/helper/go.mod
          cache-dependency-path: native/unix/helper/go.sum

      - name: macOS helper 回归
        working-directory: native/unix/helper
        run: go test ./...

      - name: 安装 Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_TAG" "$FLUTTER_REPO" "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: 组装
        id: stage
        env:
          PUBLISH: ${{ needs.prepare.outputs.publish }}
        run: |
          flutter --version
          chmod +x scripts/*.sh
          args=(--arch ${{ matrix.arch }} --version ${{ needs.prepare.outputs.version }} --channel ${{ needs.prepare.outputs.channel }})
          if [ "$PUBLISH" = true ]; then
            ./scripts/build-macos.sh "${args[@]}"
            tar -C build/macos/${{ matrix.arch }} -cf build/macos-stage-${{ matrix.arch }}.tar pkgroot
            echo "sha256_${{ matrix.arch }}=$(shasum -a 256 build/macos-stage-${{ matrix.arch }}.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          else
            ./scripts/build-macos.sh "${args[@]}" --package
          fi

      # artifact 不保留符号链接与可执行位，组装产物须打成 tar 传递
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: stage-macos-${{ matrix.arch }}
          path: build/macos-stage-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish != 'true'
        with:
          name: installer-macos-${{ matrix.arch }}
          path: build/installer/ECYCloud-*-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error

  # 签名凭据只存于 macos-signing 环境、只进入本作业；本作业不运行 Flutter / CocoaPods / Go 依赖的任何代码，
  # 只签 sha256 与 macos 作业输出一致的组装产物
  macos-sign:
    needs: [prepare, macos]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    runs-on: macos-26
    environment: macos-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stage-macos-${{ matrix.arch }}
          path: build

      - name: 核对并解包组装产物
        env:
          EXPECTED_SHA256: ${{ needs.macos.outputs[format('stage_sha256_{0}', matrix.arch)] }}
        run: |
          actual="$(shasum -a 256 build/macos-stage-${{ matrix.arch }}.tar | cut -d' ' -f1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "组装产物校验失败：期望 $EXPECTED_SHA256，实际 $actual" >&2
            exit 1
          fi
          mkdir -p build/macos/${{ matrix.arch }}
          tar -C build/macos/${{ matrix.arch }} -xf build/macos-stage-${{ matrix.arch }}.tar

      - name: 准备签名与公证凭据
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          missing=''
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD TEAM_ID API_KEY_P8 API_KEY_ID API_ISSUER_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ "$missing" = ' CERTIFICATE_P12 CERTIFICATE_PASSWORD TEAM_ID API_KEY_P8 API_KEY_ID API_ISSUER_ID' ]; then
            echo '未配置 macOS 签名与公证 Secrets，按 ad-hoc 出包'
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "macOS 签名与公证 Secrets 不完整，缺少：$missing" >&2
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/ecycloud-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/signing.p12"
          echo "$API_KEY_P8" | base64 -d > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          keychains=("$keychain")
          while IFS= read -r path; do keychains+=("$path"); done \
            < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          security list-keychains -d user -s "${keychains[@]}"
          app_identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n "s/.*\"\(Developer ID Application: .* ($TEAM_ID)\)\"/\1/p" | head -n1)"
          installer_identity="$(security find-identity -v -p basic "$keychain" \
            | sed -n "s/.*\"\(Developer ID Installer: .* ($TEAM_ID)\)\"/\1/p" | head -n1)"
          if [ -z "$app_identity" ] || [ -z "$installer_identity" ]; then
            echo "MACOS_CERTIFICATE_P12 中缺少团队 $TEAM_ID 的 Developer ID Application 或 Developer ID Installer 身份" >&2
            exit 1
          fi
          {
            echo "ECYCLOUD_MACOS_KEYCHAIN=$keychain"
            echo "ECYCLOUD_MACOS_SIGN_IDENTITY=$app_identity"
            echo "ECYCLOUD_MACOS_INSTALLER_IDENTITY=$installer_identity"
            echo "ECYCLOUD_MACOS_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "ECYCLOUD_MACOS_NOTARY_KEY_ID=$API_KEY_ID"
            echo "ECYCLOUD_MACOS_NOTARY_ISSUER=$API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: 签名打包
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-macos.sh --arch ${{ matrix.arch }} \
            --version ${{ needs.prepare.outputs.version }} \
            --channel ${{ needs.prepare.outputs.channel }} --package --from-stage

      - name: 清理签名与公证凭据
        if: always()
        run: |
          if [ -n "${ECYCLOUD_MACOS_KEYCHAIN:-}" ]; then
            security delete-keychain "$ECYCLOUD_MACOS_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-macos-${{ matrix.arch }}
          path: build/installer/ECYCloud-*-macos-${{ matrix.arch }}.pkg
          if-no-files-found: error

  linux:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # helper 回归以 root 核对另一 UID 进程的 /proc/<pid>/exe，容器默认不给 root 这项能力
    container:
      image: ubuntu:22.04
      options: --cap-add SYS_PTRACE
    steps:
      - name: 安装构建依赖
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates clang cmake curl file git jq ninja-build \
            pkg-config rpm unzip xz-utils zip libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev \
            libmpv-dev
          git config --global --add safe.directory '*'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/unix/helper/go.mod
          cache-dependency-path: native/unix/helper/go.sum

      - name: Linux helper 回归
        working-directory: native/unix/helper
        run: go test ./...

      - name: 安装 Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_TAG" "$FLUTTER_REPO" "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: 出包
        run: |
          flutter --version
          chmod +x scripts/*.sh
          ./scripts/build-linux.sh --arch ${{ matrix.arch }} --version ${{ needs.prepare.outputs.version }} \
            --channel ${{ needs.prepare.outputs.channel }} --package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-linux-${{ matrix.arch }}-deb
          path: build/installer/ECYCloud-*-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-linux-${{ matrix.arch }}-rpm
          path: build/installer/ECYCloud-*-linux-${{ matrix.arch }}.rpm
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-linux-${{ matrix.arch }}-tar
          path: build/installer/ECYCloud-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-linux-${{ matrix.arch }}-appimage
          path: build/installer/ECYCloud-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      stage_sha256: ${{ steps.stage.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/android/mihomo/go.mod
          cache-dependency-path: native/android/mihomo/go.sum

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_TAG" "$FLUTTER_REPO" "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: 出包
        run: |
          ndk_version="$(sed -n 's/.*ndkVersion = "\([^"]*\)"/\1/p' app/android/app/build.gradle.kts | tr -d '\r')"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ndk_home="$ANDROID_HOME/ndk/$ndk_version"
          if [ ! -x "$sdkmanager" ]; then
            echo "找不到 sdkmanager：$sdkmanager" >&2
            exit 1
          fi
          if [ ! -d "$ndk_home" ]; then
            yes | "$sdkmanager" --sdk_root="$ANDROID_HOME" --channel=3 --install "ndk;$ndk_version" || true
          fi
          if [ ! -d "$ndk_home" ]; then
            curl -fsSL -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r30-linux.zip
            # Google 只公布 SHA-1；此 SHA-256 取自大小与官方 SHA-1 都核对一致的同一文件，升级 NDK 时按同样方法重算
            echo "753611f410d002cfcd3f3dc2ef49aad532089d3180b436c060a90bf0fcb64df2  $RUNNER_TEMP/ndk.zip" | sha256sum -c
            mkdir -p "$ANDROID_HOME/ndk"
            unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP/ndk"
            mv "$RUNNER_TEMP/ndk/android-ndk-r30" "$ndk_home"
          fi
          if [ ! -d "$ndk_home" ]; then
            echo "NDK $ndk_version 安装失败" >&2
            exit 1
          fi
          export ANDROID_NDK_HOME="$ndk_home"
          flutter --version
          chmod +x scripts/*.sh
          ./scripts/build-android.sh --version ${{ needs.prepare.outputs.version }} \
            --channel ${{ needs.prepare.outputs.channel }} --build-number ${{ github.run_number }}

      - name: 打包未签名产物
        id: stage
        if: needs.prepare.outputs.publish == 'true'
        run: |
          tar -C build/installer -cf build/android-stage.tar .
          echo "sha256=$(sha256sum build/android-stage.tar | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: stage-android
          path: build/android-stage.tar
          retention-days: 1
          if-no-files-found: error

      - name: 用临时密钥签名
        if: needs.prepare.outputs.publish != 'true'
        run: |
          build_tools="$(sed -n 's/.*buildToolsVersion = "\([^"]*\)"/\1/p' app/android/app/build.gradle.kts | tr -d '\r')"
          tools="$ANDROID_HOME/build-tools/$build_tools"
          if [ ! -x "$tools/apksigner" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "build-tools;$build_tools" >/dev/null || true
          fi
          if [ ! -x "$tools/apksigner" ] || [ ! -x "$tools/zipalign" ]; then
            echo "build-tools $build_tools 安装失败" >&2
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/test-signing.p12"
          trap 'rm -f "$keystore"' EXIT
          TEST_KEY_PASSWORD="$(openssl rand -hex 24)"
          export TEST_KEY_PASSWORD
          keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass:env TEST_KEY_PASSWORD \
            -alias test -keyalg RSA -keysize 3072 -validity 365 -dname 'CN=ECYCloud CI Test'
          for unsigned in build/installer/*.apk; do
            aligned="$RUNNER_TEMP/$(basename "$unsigned")"
            signed="${unsigned%.apk}-test-signed.apk"
            "$tools/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
            "$tools/apksigner" sign --ks "$keystore" --ks-pass env:TEST_KEY_PASSWORD \
              --ks-key-alias test --key-pass env:TEST_KEY_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true \
              --v3-signing-enabled false --v4-signing-enabled false \
              --out "$signed" "$aligned"
            "$tools/zipalign" -c -P 16 4 "$signed"
            "$tools/apksigner" verify --verbose "$signed"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish != 'true'
        with:
          name: installer-android-arm64-test-signed
          path: build/installer/ECYCloud-*-android-arm64-test-signed.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish != 'true'
        with:
          name: installer-android-arm-test-signed
          path: build/installer/ECYCloud-*-android-arm-test-signed.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.prepare.outputs.publish != 'true'
        with:
          name: installer-android-x64-test-signed
          path: build/installer/ECYCloud-*-android-x64-test-signed.apk
          if-no-files-found: error

  # 签名凭据只存于 android-signing 环境、只进入本作业；本作业不运行 Flutter / Gradle / Go 依赖的任何代码，
  # 只签 sha256 与 android 作业输出一致的未签名产物
  android-sign:
    needs: [prepare, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: android-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: stage-android
          path: build

      - name: 核对并解包未签名产物
        env:
          EXPECTED_SHA256: ${{ needs.android.outputs.stage_sha256 }}
        run: |
          actual="$(sha256sum build/android-stage.tar | cut -d' ' -f1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "未签名产物校验失败：期望 $EXPECTED_SHA256，实际 $actual" >&2
            exit 1
          fi
          mkdir -p build/unsigned
          tar -C build/unsigned -xf build/android-stage.tar

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 签名
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=''
          for name in ANDROID_KEYSTORE ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Android 签名 Secrets 缺少：$missing，无法产出可覆盖安装的正式包" >&2
            exit 1
          fi
          build_tools="$(sed -n 's/.*buildToolsVersion = "\([^"]*\)"/\1/p' app/android/app/build.gradle.kts | tr -d '\r')"
          tools="$ANDROID_HOME/build-tools/$build_tools"
          if [ ! -x "$tools/apksigner" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --install "build-tools;$build_tools" >/dev/null || true
          fi
          if [ ! -x "$tools/apksigner" ] || [ ! -x "$tools/zipalign" ]; then
            echo "build-tools $build_tools 安装失败" >&2
            exit 1
          fi
          umask 077
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          mkdir -p build/installer
          for unsigned in build/unsigned/*.apk; do
            aligned="$RUNNER_TEMP/$(basename "$unsigned")"
            signed="build/installer/$(basename "$unsigned")"
            "$tools/zipalign" -P 16 -f 4 "$unsigned" "$aligned"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_STORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true \
              --v3-signing-enabled false --v4-signing-enabled false \
              --out "$signed" "$aligned"
            "$tools/zipalign" -c -P 16 4 "$signed"
            "$tools/apksigner" verify --verbose "$signed"
          done

      - name: 清理签名密钥
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-android-arm64
          path: build/installer/ECYCloud-*-android-arm64.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-android-arm
          path: build/installer/ECYCloud-*-android-arm.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-android-x64
          path: build/installer/ECYCloud-*-android-x64.apk
          if-no-files-found: error

  openwrt:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        openwrt: ['23.05', '24.10', '25.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 SDK 依赖
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential file gawk git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip wget xz-utils zstd

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cache/openwrt-sdk-${{ matrix.openwrt }}.*.tar.*
          key: openwrt-sdk-${{ matrix.openwrt }}-${{ hashFiles('scripts/build-openwrt.sh') }}

      - name: 出包
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-openwrt.sh --version ${{ needs.prepare.outputs.version }} \
            --channel ${{ needs.prepare.outputs.channel }} --openwrt ${{ matrix.openwrt }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installer-openwrt-${{ matrix.openwrt }}
          path: build/installer/ECYCloud-*-openwrt-${{ matrix.openwrt }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, windows-sign, macos-sign, linux, android-sign, openwrt]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: installer
          pattern: installer-*
          merge-multiple: true

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          kernel="$(jq -r '.mihomo.version' scripts/kernel.lock.json)"
          if [ "$CHANNEL" = pre ]; then
            title="Pre $VERSION"
            is_pre=true
          else
            title="v$VERSION"
            is_pre=false
          fi
          {
            echo "ECY Cloud 客户端 $title，随包 mihomo $kernel。"
            if [ "$is_pre" = true ]; then
              echo
              echo "> **Pre 测试版**：用于验证新功能，可能仍有未修复的问题；日常使用请优先等待正式版（非 Pre-release）。"
            fi
            echo
            echo "## 该下载哪个？"
            echo
            echo "多数用户按设备选下面这一行即可，不要下错架构："
            echo
            echo "| 你的设备 | 下载这个 |"
            echo "| --- | --- |"
            echo "| Windows 电脑（常见 64 位） | \`ECYCloud-$VERSION-windows-x64.exe\` |"
            echo "| Windows on ARM（部分 Surface / ARM 笔记本） | \`ECYCloud-$VERSION-windows-arm64.exe\` |"
            echo "| Mac（Apple 芯片：M1 / M2 / M3 / M4） | \`ECYCloud-$VERSION-macos-arm64.pkg\` |"
            echo "| Mac（Intel） | \`ECYCloud-$VERSION-macos-x64.pkg\` |"
            echo "| Android 手机 / 平板（主流） | \`ECYCloud-$VERSION-android-arm64.apk\` |"
            echo "| Debian / Ubuntu 及衍生版 | \`ECYCloud-$VERSION-linux-x64.deb\` 或 \`...-linux-arm64.deb\` |"
            echo "| Fedora / openSUSE / RHEL 系 | \`ECYCloud-$VERSION-linux-x64.rpm\` 或 \`...-linux-arm64.rpm\` |"
            echo "| 其它 Linux（Arch 等） | \`ECYCloud-$VERSION-linux-*.tar.gz\`，解包后 \`sudo ./install.sh\` |"
            echo "| 不想按发行版选包的 Linux | \`ECYCloud-$VERSION-linux-x64.AppImage\` 或 \`...-linux-arm64.AppImage\`，首次运行授权安装 |"
            echo "| OpenWrt 25.12（apk） | \`ECYCloud-$VERSION-openwrt-25.12.tar.gz\` |"
            echo "| OpenWrt 24.10（ipk） | \`ECYCloud-$VERSION-openwrt-24.10.tar.gz\` |"
            echo "| OpenWrt 23.05（ipk；需自行提供兼容内核包） | \`ECYCloud-$VERSION-openwrt-23.05.tar.gz\` |"
            echo
            echo "不确定 Windows / Mac 架构时：Windows 看「设置 → 系统 → 关于 → 系统类型」；Mac 看「关于本机」，芯片写 Apple 则选 arm64，写 Intel 则选 x64。Android 真机几乎都是 arm64；\`android-arm.apk\` 仅旧 32 位设备，\`android-x64.apk\` 仅模拟器。"
            echo
            echo "OpenWrt 插件为 noarch，按系统版本选包。先安装适配本机的 \`mihomo\`（如 \`mihomo-meta\`，**不要装 nikki**），解包后按 INSTALL.txt 安装：25.12 用 \`apk add --allow-untrusted\`，24.10 / 23.05 用 \`opkg install\`。Nikki 源不提供 23.05 分支，该版本需自行提供兼容内核包。"
            echo
            echo "桌面三端安装时需要一次管理员授权以注册后台服务，此后日常使用不再要求提权；Android 首次连接时会弹出系统的 VPN 授权。客户端每 24 小时检查一次自身与 mihomo 内核更新，发现新版会在界面上提示。"
          } > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" installer/*
            gh release edit "$TAG" --title "$title" --notes-file notes.md --prerelease="$is_pre"
          else
            # 手动发布时标签尚不存在：不指定提交会打在默认分支当前 HEAD，与实际构建的源码不一致
            gh release create "$TAG" installer/* --target "$GITHUB_SHA" --title "$title" --notes-file notes.md --prerelease="$is_pre"
          fi
