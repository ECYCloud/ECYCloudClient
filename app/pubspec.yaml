name: ecycloud_client
description: "ECY Cloud"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.6
  ffi: ^2.2.0
  file_picker: ^11.0.3
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  flutter_svg: ^2.3.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 由 scripts/sync-assets.ps1 从面板目录刷新后入库；策略组图标不在这里，由面板下发地址后运行期缓存
    - assets/flags/
    - assets/regions.json
