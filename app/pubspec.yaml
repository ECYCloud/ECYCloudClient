name: ecycloud_client
description: "ECY Cloud"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.4"

dependencies:
  crypto: ^3.0.6
  ffi: ^2.2.0
  file_picker: ^13.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_html: ^3.0.0
  flutter_svg: ^2.3.0
  # flutter_html 3.0.0 仍调用 html 0.15.7 已删除的内部 matches 接口。
  html: 0.15.6
  http: ^1.6.0
  intl: any
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # 由 scripts/sync-assets.ps1 从面板目录刷新后入库；策略组图标不在这里，由面板下发地址后运行期缓存
    - assets/flags/
    - assets/regions.json
    - assets/alipay.png
    - assets/wxpay.png
    - assets/app_icon.png
